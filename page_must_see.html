<!DOCTYPE html>
<html lang= "en">

<!-- This head section contains all the invisible information about the page -->
  <head>
    <title>WD final project - PAGE2X</title>
    <meta name="description" content="Prototype website for the final project">  
    <meta name="keywords" content="to be updated">
    
    
    <!-- ######## COMMON ###########    -->
    <!-- meta-->
    <meta charset="utf-8">
    <meta name="author" content="KK">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="refresh" content="600">    
    
    <!-- styles-->
    <link rel="stylesheet" type="text/css" href="StyleSheet/style.css">
    <link rel="stylesheet" type="text/css" href="StyleSheet/page__must_see.css">
  
    <!-- scripts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.js"></script>
    <!-- scripts related to inserting an external html    -->
    <script src="scripts/getFile.js">  </script>
    <script src="scripts/insert_External_Elements.js"></script>
    <!--  ### END COMMON-->
    
    
  </head>

<body>
  <div id=grid-container-index>
    <div class="progress_bar"></div>
      <!--EXTERNAL CODE    -->
    <header id="header__target" class="closed_area">
          <script id="template" type="template/handlebars">{{>header__partial}}</script>
          <script> 
            insert_external_elements(
              "header__target", 
              "header__partial", 
              "external_header.html"
            );
          </script> 
        </header>

    <aside id="accesibility_target" class="accessibility ">
          <script id="template" type="template/handlebars">{{>accesibility_partial}}</script>

          <script> 
            insert_external_elements(
              "accesibility_target", 
              "accesibility_partial", 
              "external_accessibility.html"
            );
         </script>
        </aside>

    <nav id="nav__target" class="navBar" >
        <script id="template" type="template/handlebars">{{>nav__partial}}</script>
        <script> 
          insert_external_elements(
            "nav__target", 
            "nav__partial", 
            "external_nav.html"
          );
        </script>
      </nav>

    <aside class="breadcrumbs">
        <span class="breadcrumbs__text">
          <a class="bradcrumbs__link" href="page_must_see.html" >Home Page</a>
          &#x232A
          <strong class="breadcrumbs__at">Must See 1-day</strong>
        </span>  
      </aside>
    
    <section class="panorama_top">
      <img class="panorama_top__img" alt="Main page image - View at the Zamkowy Square with the Must See sign overlayed" src="Resources/Images/must_see/must_see__top.jpg">
      <h2 class="panorama_top__heading">Must See 1-day</h2>
    </section>        
    
    <main>
      <section id="must_see_main__target" class="">
        
        <script id="must_see_main__template" type="template/handlebars">
        
          {{#places}}
                <div class="must_see_main__item" id="{{name}}">
                  <h4 class="must_see_main__name">{{name}}</h4>
                  <img class="must_see_main__img" src="{{image_path}}" alt="{{name}} image">
                  <p class="must_see_main__description">{{description}}</p>
                  <a href="{{link}}" class="must_see_main__link">See the official tourism site</a>
                </div>
              {{/places}}

          </script> 
        
        <script type="module" src="scripts/template__must_see_main.js"></script>
      </section>
      
      
       
    </main>
    
    
      <aside class="sidePanel">
        <section id="must_see_short__target" class="must_see_short closed_area">
          <script id="must_see_short__template" type="template/handlebars">
            <h3 class="must_see_short__heading">At this page:</h1>
              {{#places}}
                <ol class="must_see_short__list">
                <li class="must_see_short__item">
                  <img class="must_see_short__img" src="{{image_path}}" alt="{{name}} link image">
                  <span class="must_see_short__name">
                    <a class="must_see_short__link" href="#{{name}}">
                      <span class="must_see_short__symbol">
                        &#x1F517
                      </span>
                      {{name}}
                    </a>
                  </span>
                  
                </li>
                </ol>
              {{/places}}

          </script> 
        
        <script type="module" src="scripts/template__must_see_short.js"></script>
      </section>
       
      </aside>  
    
    
    <footer id="footer__target" class="footer closed_area">
        <script id="template" type="template/handlebars">{{>footer__partial}}</script>
        <script>
          insert_external_elements(
            "footer__target",
            "footer__partial",
            "external_footer.html"
          );
        </script>
      </footer>
    
    
  </div>
 
  <!--COMMON scripts  -->
  <script src="scripts/progress_bar.js"></script>
  <script src="scripts/accessibility__darkMode.js" defer></script>
  <script src="scripts/accessibility__change_font_size.js" defer></script>
  
</body>


</html>
