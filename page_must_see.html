<!DOCTYPE html>
<html lang= "en">

<!-- This head section contains all the invisible information about the page -->
  <head>
    <title>WD final project - PAGE2X</title>
    <meta name="description" content="Prototype website for the final project">  
    <meta name="keywords" content="to be updated">
    
    
    <!-- ######## COMMON ###########    -->
    <!-- meta-->
    <meta charset="utf-8">
    <meta name="author" content="KK">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="refresh" content="600">    
    
    <!-- styles-->
    <link rel="stylesheet" type="text/css" href="StyleSheet/common_style.css">
      
    <!-- scripts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.js"></script>
    <!-- scripts related to inserting an external html    -->
    <script src="scripts/getFile.js">  </script>
    <script src="scripts/insert_External_Elements.js"></script>
    <!--  ### END COMMON-->
    
    
  </head>

<body>
  <div id=grid-container-index>
    <div class="progress_bar"></div>
      <!--EXTERNAL CODE    -->
    <header id="header__target" class="gridArea">
          <script id="template" type="template/handlebars">{{>header__partial}}</script>
          <script> 
            insert_external_elements(
              "header__target", 
              "header__partial", 
              "external_header.html"
            );
          </script> 
        </header>

    <aside id="accesibility_target" class="gridArea fpAccessibility ">
          <script id="template" type="template/handlebars">{{>accesibility_partial}}</script>

          <script> 
            insert_external_elements(
              "accesibility_target", 
              "accesibility_partial", 
              "external_accessibility.html"
            );
         </script>
        </aside>

    <nav id="nav__target" class="gridArea">
          <script id="template" type="template/handlebars">{{>nav__partial}}</script>
          <script> 
            insert_external_elements(
              "nav__target", 
              "nav__partial", 
              "external_nav.html"
            );
          </script>
        </nav>

    <aside class="breadcrumbs gridArea"`>
        breadcrumbs to do</aside>
            
    <main>
      <section id="must_see__target" >
          <script id="must_see__template" type="template/handlebars">
            <h1>{{title}}</h1>
              {{#places}}
                <div class="must_see">
                  <h4 class="must_see__name">{{name}}</h4>
                  <img class="must_see__img" src="{{image_path}}">
                  <p class="must_see__description">{{description}}</p>
                  <a href="{{link}}" class="must_see__link">See the official tourism site</a>
                </div>
              {{/places}}

          </script> 
        
        <script src="scripts/template_data__must_see.js"></script>
      </section>
    </main>
    
    <aside id="aside1" class="gridArea"><h2>ASIDE1</h2></aside>
    <aside id="aside2" class="gridArea"><h2>ASIDE2</h2></aside>
    <footer id="footer__target" class="gridArea">
        <script id="template" type="template/handlebars">{{>footer__partial}}</script>
        <script>
          insert_external_elements(
            "footer__target",
            "footer__partial",
            "external_footer.html"
          );
        </script>
      </footer>
  </div>
 
  <!--COMMON scripts  -->
  <script src="scripts/progress_bar.js"></script>
  <script src="scripts/accessibility__darkMode.js" defer></script>
  <script src="scripts/accessibility__change_font_size.js" defer></script>
  
</body>


</html>
