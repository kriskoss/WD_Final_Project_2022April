<!DOCTYPE html>
<html lang= "en">

<!-- This head section contains all the invisible information about the page -->
  <head>
    <title>Cafés</title>
    <meta name="description" content="List of recommended cafés in Warsaw ">  
    <meta name="keywords" content="Café coffee Warsaw Warszawa">
    
    <!-- ######## COMMON ###########    -->
    <!-- meta-->
    <meta charset="utf-8">
    <meta name="author" content=Candidate No. RR1762>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="refresh" content="600">    
    
    <!-- styles-->
    <link rel="stylesheet" type="text/css" href="StyleSheet/style.css">
    <link rel="stylesheet" type="text/css" href="StyleSheet/page__cafes.css">
      
    <!-- scripts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.js"></script>
    <!-- scripts related to inserting an external html    -->
    <script src="scripts/getFile.js">  </script>
    <script src="scripts/insert_External_Elements.js"></script>
    <!--  ### END COMMON-->
    
    

    

    
    
  
  </head>
  
  <body>
<!--    container containig grid view elements-->
    <div id=grid-container-index>
      <div class="progress_bar"></div>
           
      <header id="header__target" class="closed_area">
        <script id="template" type="template/handlebars">{{>header__partial}}</script>
      
        <script> 
          insert_external_elements(
            "header__target", 
            "header__partial", 
            "external_header.html"
          );
        </script> 
      </header>
                  
      <aside id="accesibility_target" class="accessibility">
        <script id="template" type="template/handlebars">{{>accesibility_partial}}</script>
        
        <script> 
          insert_external_elements(
            "accesibility_target", 
            "accesibility_partial", 
            "external_accessibility.html"
          );
       </script>
      </aside>

      <nav id="nav__target" class="navBar" >
        <script id="template" type="template/handlebars">{{>nav__partial}}</script>
        <script> 
          insert_external_elements(
            "nav__target", 
            "nav__partial", 
            "external_nav.html"
          );
        </script>
      </nav>
      
      <aside class="breadcrumbs">
        <span class="breadcrumbs__text">
          <a class="bradcrumbs__link" href="index.html" >Home Page</a>
          &#x232A
          <strong class="breadcrumbs__at">Cafes</strong>
        </span>  
      </aside>
      
      <section class="panorama_top">
        <img class="panorama_top__img" alt="Main page image - the coffee beans with the sign Cafes on top of it "  src="Resources/Images/cafes/cafe_top.jpg">
        <h2 class="panorama_top__heading"> Best cafes</h2>
      </section>  
      
      <main class="">
      
        <section id="cafes_main_target" class="cafes_main">
          <script id="cafes_main_template" type="template/handlebars">
              {{#cafes}}
                <div class="cafes_main__item" id="{{name}}">
                  <div class="cafes_main__image_box">
                    <img class="cafes_main__img" src="{{img_path}}" alt="{{name}} image and logo">
                    <img class="cafes_main__logo" src="{{logo_path}}" >
                  </div>
                  <h4 class="cafes_main__name">{{name}}</h4>
                  <p class="cafes_main__description">{{description}}</p>
                </div>
              {{/cafes}}

          </script> 
        
        <script type="module" src="scripts/template__cafes_main.js"></script>
      </section>
      
      </main>
      
      <aside class="sidePanel">
        <section id="cafes_short__target" class="cafes_short closed_area"> 
          <script id="cafes_short__template" type="template/handlebars">
            <h4 class="cafes_short__title">At this page:</h4>
            <div class="cafes_short__flex_area">
            {{#cafes}}
              <div class="cafes_short__item">
                <img class="cafes_short__mini_img" src="{{img_path}}" alt="{{name}} link image and logo">
                <img class="cafes_short__logo" src="{{logo_path}}">
                <span class="cafes_short__name">
                  <a class="cafes_short__link" href="#{{name}}">
                    {{name}} <span class="cafes_short__symbol">&#x1F517</span>
                  </a>
                </span>
              </div>
            {{/cafes}}
            </div>
          </script>

          <script type="module" src="scripts/template__cafes_short.js"></script>
        </section>
      </aside>  
      

      <footer id="footer__target" class="footer closed_area">
        <script id="template" type="template/handlebars">{{>footer__partial}}</script>
        <script>
          insert_external_elements(
            "footer__target",
            "footer__partial",
            "external_footer.html"
          );
        </script>
      </footer>
    
    </div>
    
  
  <!--COMMON scripts  -->
  <script src="scripts/progress_bar.js"></script>
  <script src="scripts/accessibility__darkMode.js" defer></script>
  <script src="scripts/accessibility__change_font_size.js" defer></script>  

</body>
</html>
