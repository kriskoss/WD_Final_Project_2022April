  <div class="event_listener_examples">
    <h2>Week 14 - event listerners</h2>
    <div class="eventHandler_onclick">
      <h3>Event handler - simple example</h3>
      <p>notice the use of a function(){} with every handler</p>
      <button id="btn">Event handler - on click </button>
    </div>
    <script>
      btn = document.getElementById("btn")
      btn.onclick = function() {
        alert("You have clicked me")
      };
    </script>

    
    <div class=eventListener_example>
    
    <button id="btn3">Event listener 1</button>  
    <button id="btn4">Event listener 2</button>  
    <script>
      
      
      function changeText(c){
        c.textContent="Mouse over"
      }
      
      function restoreText(c){
        c.textContent="Event listener"
      }
      
      function once() {
        alert("You have clicked me");
      }
      
      function mouse() {
        alert("Mouse is over me")
      }
      
      btn3=document.getElementById("btn3");
      btn3.addEventListener("click", once);
      btn3.addEventListener("mouseout", mouse);
      
      btn4=document.getElementById("btn4");
      btn4.addEventListener("click", once);
      btn4.addEventListener("mouseover", function() {changeText(this)});
      btn4.addEventListener("mouseout", function() {restoreText(this)});
    </script>
  </div>
