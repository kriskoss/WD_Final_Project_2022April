<h3>Example 4 -  "best seller list" - safe list (T=16:01)</h3>
        <div class="app Example4_safelist">
          <h3>Best Sellers - with the SAFE LIST</h3>
          <p>Here the input list is being escaped. Then escaped HTML is being reintroduced in the code.</p>
          
            <!-- below list is a helper and bestsellers is a data which is passed into the helper-->
          <script id="ex4_template" type="template/handlebars">
            {{list bestsellers}} 
          </script>
          
          <span id="ex4_target"></span>
          
          <script>
            let ex4_src = document.getElementById("ex4_template").innerHTML;
            let ex4_template = Handlebars.compile(ex4_src);
            
            // here we need to tegister out helpers (in )
            Handlebars.registerHelper("list", function(list){
              let output = "<div class='app'>"
              output +="<h4>List rendered as HTML, not as text</h4>";
              output+= "<ol>"
              
              for (var i in list) {
//                output+= Handlebars.Utils.escapeExpression(list[i]);
                output+="<li>" +Handlebars.Utils.escapeExpression(list[i])+ "</li>";
              }
              output+="</ol></div>";
              return new Handlebars.SafeString(output);
            });
            
            //it the line below we are passing the data into ex4_template
            let ex4_rendered = ex4_template(
              {bestsellers:["list item A", 
                            "list item B",
                            "list item C"]
              }
            );
            document.getElementById("ex4_target").innerHTML=ex4_rendered;
          </script>
        </div>
