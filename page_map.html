<!DOCTYPE html>
<html lang= "en">

<!-- This head section contains all the invisible information about the page -->
<head>
    <title>Cafes Map</title>
    <meta name="description" content="Page contains interactive map of Warsaw">
    <meta name="keywords" content="Warsaw city map cafes">
      
    
    <!-- ######## COMMON ###########    -->
    <!-- meta-->
    <meta charset="utf-8">
    <meta name="author" content="KK">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="refresh" content="600">    
    
    <!-- styles-->
    <link rel="stylesheet" type="text/css" href="StyleSheet/style.css">
      
    <!-- scripts-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.js"></script>
    <!-- scripts related to inserting an external html    -->
    <script src="scripts/getFile.js">  </script>
    <script src="scripts/insert_External_Elements.js"></script>
    <!--  ### END COMMON-->

    
  </head>
  
  <body>
<!--    container containig grid view elements-->
    <div id=grid-container-index>
      <div class="progress_bar">
        
      </div>
          
      <header id="header__target" class="closed_area">
        <script id="template" type="template/handlebars">{{>header__partial}}</script>
      
        <script> 
          insert_external_elements(
            "header__target", 
            "header__partial", 
            "external_header.html"
          );
        </script> 
      </header>
                  
      <aside id="accesibility_target" class="accessibility">
        <script id="template" type="template/handlebars">{{>accesibility_partial}}</script>
        
        <script> 
          insert_external_elements(
            "accesibility_target", 
            "accesibility_partial", 
            "external_accessibility.html"
          );
       </script>
      </aside>
      
      <nav id="nav__target" class="navBar" >
        <script id="template" type="template/handlebars">{{>nav__partial}}</script>
        <script> 
          insert_external_elements(
            "nav__target", 
            "nav__partial", 
            "external_nav.html"
          );
        </script>
      </nav>

      <aside class="breadcrumbs">
        <span class="breadcrumbs__text">
          <a class="bradcrumbs__link" href="index.html" >Home Page</a>
            &#x232A
          <strong class="breadcrumbs__at">Warsaw Photo Gallery</strong>
        </span>  
      </aside>
      
      <aside class="sidePanel">
        <section class="at_this_page closed_area">
          <h2>At this page:</h2>
          <ul>
            <li>Introduction</li>
            <li>Photos of Warsaw</li>
            
          </ul>
        </section>
              
        <section class="underground closed_area">
          <label for="underground__toggle" id="underground__label">&#x25BE Underground Map</label>
          <input type="checkbox" id="underground__toggle">
          
          <div class="underground__area">
            <h2 class="underground__heading">Underground Map:</h2>
            <a class="underground__link"href='https://metro.waw.pl/metro-warszawskie/linia-m1/przebieg/'>
              <img class="underground__img" src="Resources/VectorImages/metroMap.png" alt="Warsaw metro diagram">
            </a>
          </div>
        </section>
    
        <section class="apps closed_area">
          <label for="apps__toggle" id="apps__label">&#x25BE Apps</label>
          <input type="checkbox" id="apps__toggle">
          <div class="apps__hidingArea">
            <h3 class="apps__heading">Apps:</h3>
            <div class="app">
              <a class="app_link" href="https://jakdojade.pl/warszawa/trasa/">
                <img class="app__img" src="Resources/Icons/jakdojadeIcon.webp" alt='JakDojade Application logo'>JakDojade
              </a>
              <p class="app__description">- the best app for public transport in Warsaw</p>
            </div>


            <div class="app">
              <a class="app_link" href="https://veturilo.waw.pl/en/">
                <img class="app__img" src="Resources/Icons/VeturiloLogo.svg" alt="Veturilo - Public Bikes logo">Veturilo
              </a>
              <p class="app__description">- Warsaw public bicycles</p>
            </div>
          </div>
        </section>
      
      </aside>  
      
    <footer id="footer__target" class="footer closed_area">
        <script id="template" type="template/handlebars">{{>footer__partial}}</script>
        <script>
          insert_external_elements(
            "footer__target",
            "footer__partial",
            "external_footer.html"
          );
        </script>
      </footer>
    
  </div>  
  
</body>



</html>
